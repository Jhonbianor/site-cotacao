<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cotação de Plano de Saúde</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 300px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      text-align: center;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      margin-bottom: 20px;
      color: #555;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #25D366;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #1ebe5d;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Você pode pagar menos!</h1>
  <p>Descubra agora gratuitamente</p>

  <input type="text" id="nome" placeholder="Seu nome">
  <input type="number" id="idade" placeholder="Sua idade">
  <input type="text" id="cidade" placeholder="Sua cidade">

  <button onclick="enviarWhats()">Quero minha cotação</button>
</div>

<script>
  function enviarWhats() {
    let nome = document.getElementById('nome').value;
    let idade = document.getElementById('idade').value;
    let cidade = document.getElementById('cidade').value;

    let numero = "5599999999999"; // TROCA PELO SEU NÚMERO

    let mensagem = `Olá, meu nome é ${nome}, tenho ${idade} anos e sou de ${cidade}. Quero uma cotação de plano de saúde.`;

    let url = `https://wa.me/${numero}?text=${encodeURIComponent(mensagem)}`;

    window.open(url, '_blank');
  }
</script>

</body>
</html>
